openapi: 3.1.0
info:
  title: jandibat.org API
  version: 1.1.0
  description: >-
    Contract for public activity aggregation and SVG rendering, user
    authentication, subject management, provider connections, synchronization,
    and custom-provider ingestion.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Deployment-relative API origin; clients configure the concrete HTTPS origin per environment.
tags:
  - name: System
    description: Process health and dependency readiness.
  - name: Activity
    description: Public or owner-authorized activity timelines and rendered heatmaps.
  - name: Authentication
    description: Magic Link, Passkey, and session lifecycle operations.
  - name: Subjects
    description: User-owned heatmap subjects and presentation settings.
  - name: Provider connections
    description: Built-in provider catalog, credential connections, and OAuth callbacks.
  - name: Custom providers
    description: Push-only custom activity sources and idempotent ingestion.
  - name: Synchronization
    description: Manual and scheduled provider synchronization jobs.

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API and dependency health
      security: []
      responses:
        '200':
          description: API is healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/providers:
    get:
      tags: [Activity]
      operationId: listProviderCatalog
      summary: List supported activity provider types
      security: []
      responses:
        '200':
          description: Provider catalog
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalogResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/activities/{subject}:
    parameters:
      - $ref: '#/components/parameters/Subject'
    get:
      tags: [Activity]
      operationId: getActivities
      summary: Get a normalized activity timeline
      description: >-
        Returns public activity unless the authenticated owner requests a private
        subject or data from a private provider connection. Dates are interpreted
        in the requested timezone and are inclusive.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/ForceRefresh'
        - $ref: '#/components/parameters/EnvironmentIds'
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Normalized activity timeline
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityTimelineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/render/{subject}.svg:
    parameters:
      - $ref: '#/components/parameters/Subject'
    get:
      tags: [Activity]
      operationId: renderHeatmapSvg
      summary: Render an activity heatmap as SVG
      description: Returns a safe, self-contained SVG suitable for Markdown embedding.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/ForceRefresh'
        - $ref: '#/components/parameters/EnvironmentIds'
        - name: theme
          in: query
          schema:
            $ref: '#/components/schemas/HeatmapTheme'
        - name: cellSize
          in: query
          description: Cell size in CSS pixels.
          schema:
            type: integer
            minimum: 6
            maximum: 32
            default: 11
        - name: showLegend
          in: query
          schema:
            type: boolean
            default: true
        - name: weekStart
          in: query
          schema:
            $ref: '#/components/schemas/WeekStart'
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: SVG heatmap
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/magic-link/request:
    post:
      tags: [Authentication]
      operationId: requestMagicLink
      summary: Request an email sign-in link
      description: >-
        Always returns the same accepted response so account existence is not
        disclosed. Delivery is rate limited by address and client. The email link
        carries the one-time token only in the URL fragment, never in the query
        string, so intermediaries and access logs do not receive the credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: The request was accepted for delivery if eligible
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/magic-link/consume:
    post:
      tags: [Authentication]
      operationId: consumeMagicLink
      summary: Exchange a one-time magic-link token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/passkey/register/options:
    post:
      tags: [Authentication]
      operationId: beginPasskeyRegistration
      summary: Start passkey registration
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationOptionsRequest'
      responses:
        '200':
          description: WebAuthn credential creation options
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/passkey/register/finish:
    post:
      tags: [Authentication]
      operationId: finishPasskeyRegistration
      summary: Complete passkey registration
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationVerifyRequest'
      responses:
        '201':
          description: Passkey registered
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/passkey/sign-in/options:
    post:
      tags: [Authentication]
      operationId: beginPasskeySignIn
      summary: Start passkey authentication
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAuthenticationOptionsRequest'
      responses:
        '200':
          description: WebAuthn credential request options
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/passkey/sign-in/finish:
    post:
      tags: [Authentication]
      operationId: finishPasskeySignIn
      summary: Verify a passkey assertion and create a session
      description: >-
        A suspected authenticator clone or signature-counter regression is rejected
        with 401 and Problem code `magic_link_reauthentication_required`; no session
        is created and the user must complete Magic Link reauthentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAuthenticationVerifyRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Get the current user and session
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated session
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Authentication]
      operationId: signOut
      summary: Revoke the current session
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the current user's active sessions
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active and recently revoked sessions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Authentication]
      operationId: revokeOtherSessions
      summary: Revoke all sessions except the current one
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Other sessions revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Authentication]
      operationId: revokeSession
      summary: Revoke one of the current user's sessions
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [Subjects]
      operationId: getCurrentUser
      summary: Get the authenticated user profile
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/settings:
    get:
      tags: [Subjects]
      operationId: getUserSettings
      summary: Get user-level preferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: User preferences
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subjects]
      operationId: updateUserSettings
      summary: Update user-level preferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Updated preferences
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/subjects:
    get:
      tags: [Subjects]
      operationId: listSubjects
      summary: List subjects owned by the current user
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owned subjects
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subjects]
      operationId: createSubject
      summary: Create a subject
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201':
          description: Subject created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/subjects/{subject}:
    parameters:
      - $ref: '#/components/parameters/Subject'
    get:
      tags: [Subjects]
      operationId: getSubject
      summary: Get a subject
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Subject details
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subjects]
      operationId: updateSubject
      summary: Update a subject profile
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateSubjectRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubjectRequest'
      responses:
        '200':
          description: Updated subject
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      operationId: deleteSubject
      summary: Enqueue deletion of a subject and its owned data
      description: >-
        Authorizes the subject owner and durably enqueues a deletion request.
        A separate least-privilege maintenance executor performs the destructive
        workflow asynchronously; acceptance does not mean deletion is complete.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '202':
          description: Subject deletion request durably accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDeletionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/subjects/{subject}/settings:
    parameters:
      - $ref: '#/components/parameters/Subject'
    get:
      tags: [Subjects]
      operationId: getSubjectSettings
      summary: Get rendering, privacy, and synchronization settings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Subject settings
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
