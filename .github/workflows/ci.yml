name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Evaluate all systems and build host flake checks
        run: nix develop --command make nix-check
      - name: Install dependencies
        run: nix develop --command make install
      - name: Lint OpenAPI and detect generated type drift
        run: nix develop --command make openapi-check
      - name: Enforce the single CI toolchain authority
        run: nix develop --command make ci-version-authority-check
      - name: Require contract artifacts to move together
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nix develop --command make contract-change-check

  backend:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Run tests, race detector, and static analysis
        run: nix develop --command make test-api test-api-race lint-api
      - name: Check Scythe queries and generated Go drift
        run: nix develop --command make sql-check sql-generated-drift-test sql-generated-drift-check

  migrations:
    name: CockroachDB migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Start CockroachDB
        run: nix develop --command make db-up
      - name: Apply migrations twice and verify checksums
        run: |
          nix develop --command make db-migrate
          nix develop --command make db-migrate
      - name: Prove failed DDL and migration ledger roll back together
        run: nix develop --command make migration-atomicity-test
      - name: Configure and verify least-privilege runtime roles
        run: nix develop --command make db-runtime-roles-test
      - name: Verify Scythe queries against the migrated Cockroach schema
        env:
          SCYTHE_DATABASE_URL: postgresql://root@127.0.0.1:26257/jandibat?sslmode=disable
        run: nix develop --command make sql-live-drift-test sql-check-live
      - name: Exercise every Cockroach opt-in integration package
        env:
          JANDIBAT_TEST_DATABASE_URL: postgresql://root@127.0.0.1:26257/jandibat?sslmode=disable
          JANDIBAT_TEST_API_DATABASE_URL: postgresql://jandibat_api@127.0.0.1:26257/jandibat?sslmode=disable
          JANDIBAT_TEST_WORKER_DATABASE_URL: postgresql://jandibat_worker@127.0.0.1:26257/jandibat?sslmode=disable
          JANDIBAT_TEST_MAINTENANCE_DATABASE_URL: postgresql://jandibat_maintenance@127.0.0.1:26257/jandibat?sslmode=disable
        run: nix develop --command make test-api-integration
      - name: Validate staging Compose configuration
        run: nix develop --command make staging-compose-check monitoring-check
      - name: Stop CockroachDB
        if: always()
        run: nix develop --command make db-down

  security:
    name: Dependency and static security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Scan commit history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan repository for secret patterns
        run: nix develop --command make secret-scan
      - name: Scan reachable Go vulnerabilities
        run: nix develop --command sh -c 'cd apps/api && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...'
      - name: Run Go static security analysis
        run: nix develop --command sh -c 'cd apps/api && go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -severity high -confidence medium -nosec-require-rules -nosec-require-justification ./...'
      - name: Install dependencies
        run: nix develop --command make install
      - name: Audit all JavaScript workspaces
        run: nix develop --command yarn npm audit --all --recursive --severity high
      - name: Test security and recovery evidence validators
        run: nix develop --command make security-review-validator-test audit-verifier-test restore-verifier-test
      - name: Require human review evidence for security-sensitive PRs
        if: github.event_name == 'pull_request'
        env:
          SECURITY_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: nix develop --command make security-review-gate

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Install dependencies
        run: nix develop --command make install
      - name: Typecheck
        run: nix develop --command make typecheck
      - name: Test
        run: nix develop --command make test-web test-sdk
      - name: Build
        run: nix develop --command make build-web

  images:
    name: Production container builds
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag jandibat-api:ci apps/api
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag jandibat-web:ci .
      - name: Assert non-root image users
        run: |
          test "$(docker image inspect jandibat-api:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect jandibat-web:ci --format '{{.Config.User}}')" = "101:101"
      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: jandibat-api:ci
          artifact-name: jandibat-api-ci.spdx.json
          output-file: jandibat-api-ci.spdx.json
          format: spdx-json
      - name: Generate Web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: jandibat-web:ci
          artifact-name: jandibat-web-ci.spdx.json
          output-file: jandibat-web-ci.spdx.json
          format: spdx-json
      - name: Scan API image for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: jandibat-api:ci
          severity-cutoff: high
          output-format: json
          output-file: jandibat-api-grype.json
      - name: Scan Web image for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: jandibat-web:ci
          severity-cutoff: high
          output-format: json
          output-file: jandibat-web-grype.json
      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-${{ github.sha }}
          path: |
            jandibat-api-grype.json
            jandibat-web-grype.json
          if-no-files-found: error
          retention-days: 90
