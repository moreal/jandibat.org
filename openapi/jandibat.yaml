openapi: 3.1.0
info:
  title: jandibat.org HTTP Edge API
  version: 2.0.0
  description: >-
    HTTP-only operations for health, SVG rendering, browser callbacks, and
    custom-provider ingestion. GraphQL SDL is the domain API contract.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Deployment-relative API origin; clients configure the concrete HTTPS origin per environment.
tags:
  - name: System
    description: Process health and dependency readiness.
  - name: Activity
    description: HTTP SVG rendering for Markdown and static consumers.
  - name: Authentication
    description: One-time Magic Link browser callback.
  - name: Provider connections
    description: OAuth browser callback.
  - name: Custom providers
    description: Push-only custom activity ingestion.

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API and dependency health
      security: []
      responses:
        '200':
          description: API is healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/render/{subject}.svg:
    parameters:
      - $ref: '#/components/parameters/Subject'
    get:
      tags: [Activity]
      operationId: renderHeatmapSvg
      summary: Render an activity heatmap as SVG
      description: Returns a safe, self-contained SVG suitable for Markdown embedding.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/ForceRefresh'
        - $ref: '#/components/parameters/EnvironmentIds'
        - name: theme
          in: query
          schema:
            $ref: '#/components/schemas/HeatmapTheme'
        - name: cellSize
          in: query
          description: Cell size in CSS pixels.
          schema:
            type: integer
            minimum: 6
            maximum: 32
            default: 11
        - name: showLegend
          in: query
          schema:
            type: boolean
            default: true
        - name: weekStart
          in: query
          schema:
            $ref: '#/components/schemas/WeekStart'
      security:
        - {}
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: SVG heatmap
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/magic-link/consume:
    post:
      tags: [Authentication]
      operationId: consumeMagicLink
      summary: Exchange a one-time magic-link token for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkConsumeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/integrations/{provider}/callback:
    get:
      tags: [Provider connections]
      operationId: completeProviderOAuthConnection
      summary: Complete an OAuth provider connection
      description: >-
        Completes the OAuth flow only when the request carries the same still-valid
        `jandibat_session` cookie that initiated the connection. A missing, expired,
        or different session is rejected with 401 before the authorization code is
        exchanged.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 1024
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
      responses:
        '303':
          description: Redirect to the web application with completion status
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/custom-providers/{customProviderId}/activities:ingest:
    parameters:
      - $ref: '#/components/parameters/CustomProviderId'
    post:
      tags: [Custom providers]
      operationId: ingestCustomProviderActivities
      summary: Ingest normalized activity facts from a custom provider
      description: >-
        Events are idempotent by eventId within the custom provider. The provider
        key must be sent in X-Jandibat-Provider-Key and is never a user session.
      security:
        - customProviderKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomActivityIngestRequest'
      responses:
        '202':
          description: Valid activity events accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomActivityIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jandibat_session
      description: Secure, HttpOnly, SameSite=Lax user session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    customProviderKey:
      type: apiKey
      in: header
      name: X-Jandibat-Provider-Key

  parameters:
    Subject:
      name: subject
      in: path
      required: true
      description: Subject ID or unique public handle.
      schema:
        $ref: '#/components/schemas/SubjectIdentifier'
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProviderId'
    CustomProviderId:
      name: customProviderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FromDate:
      name: from
      in: query
      description: Inclusive first date; defaults to 364 days before `to`.
      schema:
        $ref: '#/components/schemas/Date'
    ToDate:
      name: to
      in: query
      description: Inclusive last date; defaults to today in the selected timezone.
      schema:
        $ref: '#/components/schemas/Date'
    Timezone:
      name: timezone
      in: query
      description: IANA timezone; defaults to the subject setting.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        examples: [Asia/Seoul]
    ForceRefresh:
      name: force
      in: query
      description: Bypass cache freshness for authenticated subject owners.
      schema:
        type: boolean
        default: false
    EnvironmentIds:
      name: environmentId
      in: query
      description: Repeat to include only selected environments.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key retained for at least 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255

  headers:
    RequestId:
      description: Identifier for tracing this request.
      schema:
        type: string
    ETag:
      description: Entity tag for conditional retrieval and cache validation.
      schema:
        type: string
    Location:
      description: URI of the created resource or redirect target.
      schema:
        type: string
        format: uri-reference
    SessionCookie:
      description: Secure user session cookie.
      schema:
        type: string
        examples: [jandibat_session=opaque; Path=/; HttpOnly; Secure; SameSite=Lax]

  responses:
    BadRequest:
      description: Request validation failed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated caller cannot access this resource
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current resource state
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured ingestion limit
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until the request may be retried.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderFailure:
      description: An upstream provider failed and no usable stale value exists
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: API or a required dependency is unavailable
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until health should be checked again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    DateTime:
      type: string
      format: date-time
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ProviderId:
      type: string
      enum: [github, gitlab, codeberg]
    HeatmapTheme:
      type: string
      enum: [system, light, dark, github-light, github-dark]
      default: system
    WeekStart:
      type: string
      enum: [sunday, monday]
      default: sunday
    HealthResponse:
      type: object
      required: [status, checkedAt, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checkedAt:
          $ref: '#/components/schemas/DateTime'
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    MagicLinkVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048
          writeOnly: true
    ActivityMetric:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: [count]
        value:
          type: integer
          minimum: 0
          maximum: 1000000
          format: int64
    CustomActivityEvent:
      type: object
      additionalProperties: false
      required: [eventId, date, action, metric]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable, provider-scoped deduplication identifier.
        date:
          $ref: '#/components/schemas/Date'
        action:
          type: string
          minLength: 1
          maxLength: 64
        metric:
          $ref: '#/components/schemas/ActivityMetric'
        metadata:
          type: object
          maxProperties: 50
          propertyNames:
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
          additionalProperties:
            type: string
            maxLength: 1000
        observedAt:
          $ref: '#/components/schemas/DateTime'
    CustomActivityIngestRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, events]
      description: >-
        Batch-level shape, authentication, quota, and size failures reject the
        whole request. Event-level validation failures are reported in
        rejections while valid events in the same batch remain accepted.
      properties:
        schemaVersion:
          type: string
          const: '1.0'
          description: Version of the custom activity ingestion schema.
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CustomActivityEvent'
    IngestRejection:
      type: object
      required: [eventId, code, detail]
      properties:
        eventId:
          type: string
        code:
          type: string
        detail:
          type: string
    CustomActivityIngestResponse:
      type: object
      required: [accepted, duplicates, rejected, rejections]
      description: >-
        Counts partition the submitted events: accepted + duplicates + rejected
        equals the number of request events. Rejections contains one item for
        each rejected event and never includes batch-level failures.
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        rejections:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/IngestRejection'
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          description: JSON Pointer or parameter name.
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details with stable machine-readable extensions.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z0-9_]+$'
          examples: [validation_failed]
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    MagicLinkConsumeResponse:
      type: object
      required: [user, session]
      properties:
        user:
          type: object
          required: [id, primaryEmail, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 64
            primaryEmail:
              type: string
              format: email
            emailVerifiedAt:
              oneOf:
                - $ref: '#/components/schemas/DateTime'
                - type: 'null'
            status:
              type: string
              enum: [active, disabled, pending]
            createdAt:
              $ref: '#/components/schemas/DateTime'
            updatedAt:
              $ref: '#/components/schemas/DateTime'
        session:
          type: object
          required: [id, userId, current, createdAt, expiresAt]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            userId:
              type: string
            current:
              type: boolean
            createdAt:
              $ref: '#/components/schemas/DateTime'
            expiresAt:
              $ref: '#/components/schemas/DateTime'
            lastSeenAt:
              oneOf:
                - $ref: '#/components/schemas/DateTime'
                - type: 'null'
            revokedAt:
              oneOf:
                - $ref: '#/components/schemas/DateTime'
                - type: 'null'
            userAgent:
              type: [string, 'null']
            ipAddress:
              description: Canonical IPv4 or IPv6 address without a port.
              oneOf:
                - type: string
                  format: ipv4
                - type: string
                  format: ipv6
                - type: 'null'
