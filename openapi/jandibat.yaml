    post:
      tags: [Provider connections]
      operationId: createProviderConnection
      summary: Create a token, unauthenticated, or OAuth provider connection
      description: >-
        OAuth connections return an authorization URL and remain pending until
        the callback succeeds. Creating an OAuth2 connection requires the
        `jandibat_session` cookie because a provider browser redirect cannot
        replay an Authorization bearer header; bearer-only OAuth2 initiation is
        rejected with 401. Token and unauthenticated connection creation continue
        to accept either declared authentication scheme. Token credentials are
        write-only and never echoed.
      security:
        - sessionCookie: []
