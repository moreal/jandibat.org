input DateRangeInput {
  from: Date!
  to: Date!
}

type DateRange {
  from: Date!
  to: Date!
}

"A value object; activity days are not Relay Nodes."
type ActivityDay {
  date: Date!
  count: Long!
  level: Int!
  entries: [ActivityEntry!]!
}

type ActivityEntry {
  environmentID: String!
  action: String!
  metricName: String!
  metricValue: Long!
  metadata: [ActivityMetadataEntry!]!
}

type ActivityEnvironment {
  id: String!
  key: String!
  name: String!
  scope: String!
  metadata: [ActivityMetadataEntry!]!
}

type ActivityMetadataEntry {
  key: String!
  value: String!
}

"A complete authorized projection for static consumers."
type ActivitySnapshot {
  subject: Subject!
  range: DateRange!
  days: [ActivityDay!]!
  environments: [ActivityEnvironment!]!
  total: Long!
  longestStreak: Int!
  generatedAt: DateTime!
  "Null only when this scoped range has never incorporated activity."
  dataUpdatedAt: DateTime
  revision: String!
}

"The viewer is a scoped value object, not a globally addressable Node."
type Viewer {
  user: UserProfile!
  settings: UserSettings!
  "Forward page; first: 1..100, default 25."
  subjects(first: Int = 25, after: Cursor): SubjectConnection!
  "Forward page; first: 1..100, default 25."
  sessions(first: Int = 25, after: Cursor): SessionConnection!
}

type UserProfile {
  id: String!
  primaryEmail: String!
  status: String!
  emailVerifiedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"Standard forward-only Relay connection page information."
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

type SessionEdge {
  cursor: Cursor!
  node: Session!
}

type SessionConnection {
  edges: [SessionEdge!]!
  pageInfo: PageInfo!
}

input RequestMagicLinkInput {
  email: String!
  redirectURI: String
}

type RequestMagicLinkPayload implements MutationPayload {
  errors: [MutationError!]!
  "Always true for accepted requests, regardless of account existence."
  accepted: Boolean!
}

"WebAuthn JSON is bounded and validated at the GraphQL HTTP boundary."
type PasskeyOptions {
  ceremonyID: String!
  publicKeyJSON: String!
  expiresAt: DateTime!
}

"A credential's public account metadata; key material is never exposed."
type PasskeyCredential {
  id: String!
  label: String
  transports: [String!]!
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type BeginPasskeyRegistrationPayload implements MutationPayload {
  errors: [MutationError!]!
  options: PasskeyOptions
}

input FinishPasskeyRegistrationInput {
  ceremonyID: String!
  credentialJSON: String!
  label: String
}

type FinishPasskeyRegistrationPayload implements MutationPayload {
  errors: [MutationError!]!
  credential: PasskeyCredential
}

type BeginPasskeySignInPayload implements MutationPayload {
  errors: [MutationError!]!
  options: PasskeyOptions
}

input FinishPasskeySignInInput {
  ceremonyID: String!
  credentialJSON: String!
}

type FinishPasskeySignInPayload implements MutationPayload {
  errors: [MutationError!]!
  "Only session metadata is returned; the trusted transport sets the cookie."
  session: Session
}

type SignOutPayload implements MutationPayload {
  errors: [MutationError!]!
  session: Session
}

input RevokeSessionInput {
  id: ID!
}

type RevokeSessionPayload implements MutationPayload {
  errors: [MutationError!]!
  session: Session
}

type RevokeOtherSessionsPayload implements MutationPayload {
  errors: [MutationError!]!
  currentSession: Session
}

type SyncJobEdge {
  cursor: Cursor!
  node: SyncJob!
}

type SyncJobConnection {
  edges: [SyncJobEdge!]!
  pageInfo: PageInfo!
}

"Only the three built-in providers; no subject-specific custom providers."
type ProviderCatalogItem {
  id: String!
  name: String!
  description: String!
  kind: String!
  category: String!
  supportsOAuth: Boolean!
  supportsToken: Boolean!
  supportsPrivateData: Boolean!
}

type ProviderConnectionEdge {
  cursor: Cursor!
  node: ProviderConnection!
}

type ProviderConnectionConnection {
  edges: [ProviderConnectionEdge!]!
  pageInfo: PageInfo!
}

type CustomProviderEdge {
  cursor: Cursor!
  node: CustomProvider!
}

type CustomProviderConnection {
  edges: [CustomProviderEdge!]!
  pageInfo: PageInfo!
}

enum ProviderAuthMethod {
  PUBLIC
  TOKEN
  OAUTH2
}

input ConnectProviderInput {
  subjectID: ID!
  providerID: String!
  authMethod: ProviderAuthMethod!
  "For TOKEN only. Never echoed in a Node or response."
  token: String
  scopes: [String!]
  includePrivate: Boolean = false
  "For OAUTH2 only; checked against the server's exact redirect allowlist."
  redirectURI: String
}

type ConnectProviderPayload implements MutationPayload {
  errors: [MutationError!]!
  connection: ProviderConnection
  authorizationURL: String
}

input UpdateProviderConnectionInput {
  id: ID!
  token: String
  scopes: [String!]
  enabled: Boolean
}

type UpdateProviderConnectionPayload implements MutationPayload {
  errors: [MutationError!]!
  connection: ProviderConnection
}

input RevokeProviderConnectionInput {
  id: ID!
}

type RevokeProviderConnectionPayload implements MutationPayload {
  errors: [MutationError!]!
  "Relay ID to evict from normalized stores; revoked connections are no longer Nodes."
  revokedConnectionID: ID
}

input EnqueueManualSyncInput {
  connectionID: ID!
  "8..255 chars; never echoed."
  idempotencyKey: String!
  from: Date
  to: Date
  force: Boolean = false
  failurePolicy: FetchFailurePolicy
}

type EnqueueManualSyncPayload implements MutationPayload {
  errors: [MutationError!]!
  job: SyncJob
}

"A stable domain validation failure returned inside mutation payloads."
type MutationError {
  code: String!
  message: String!
  field: String
}

"Mutation results carry typed data and validation errors; transport failures use GraphQL errors."
interface MutationPayload {
  errors: [MutationError!]!
}

"Mutation root; domain mutations are added after their authorization tests."
type Mutation {
  _contract: Boolean!
  requestMagicLink(input: RequestMagicLinkInput!): RequestMagicLinkPayload!
  beginPasskeyRegistration: BeginPasskeyRegistrationPayload!
  finishPasskeyRegistration(input: FinishPasskeyRegistrationInput!): FinishPasskeyRegistrationPayload!
  beginPasskeySignIn: BeginPasskeySignInPayload!
  finishPasskeySignIn(input: FinishPasskeySignInInput!): FinishPasskeySignInPayload!
  signOut: SignOutPayload!
  revokeSession(input: RevokeSessionInput!): RevokeSessionPayload!
  revokeOtherSessions: RevokeOtherSessionsPayload!
  updateUserSettings(input: UpdateUserSettingsInput!): UpdateUserSettingsPayload!
  createSubject(input: CreateSubjectInput!): CreateSubjectPayload!
  updateSubject(input: UpdateSubjectInput!): UpdateSubjectPayload!
  updateSubjectSettings(input: UpdateSubjectSettingsInput!): UpdateSubjectSettingsPayload!
  requestSubjectDeletion(input: RequestSubjectDeletionInput!): RequestSubjectDeletionPayload!
  connectProvider(input: ConnectProviderInput!): ConnectProviderPayload!
  updateProviderConnection(input: UpdateProviderConnectionInput!): UpdateProviderConnectionPayload!
  revokeProviderConnection(input: RevokeProviderConnectionInput!): RevokeProviderConnectionPayload!
  enqueueManualSync(input: EnqueueManualSyncInput!): EnqueueManualSyncPayload!
}

"A durable entity with an opaque, globally unique identity."
interface Node {
  id: ID!
}

type Subject implements Node {
  id: ID!
  handle: String!
  displayName: String
  timezone: TimeZone!
  isPublic: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  "Owner-only settings; null for anonymous or non-owner readers."
  settings: SubjectSettings
  "Owner-only forward page; null for anonymous or non-owner readers."
  providerConnections(first: Int = 25, after: Cursor): ProviderConnectionConnection
  "Owner-only forward page; null for anonymous or non-owner readers."
  customProviders(first: Int = 25, after: Cursor): CustomProviderConnection
  "A bounded, static projection; non-owners see only public activity."
  activitySnapshot(
    range: DateRangeInput!
    timezone: TimeZone!
    environmentIDs: [String!]
  ): ActivitySnapshot!
}

type ProviderConnection implements Node {
  id: ID!
  providerID: String!
  environmentID: String!
  authMethod: String!
  status: String!
  externalAccountID: String!
  scopes: [String!]!
  privateDataEnabled: Boolean!
  tokenExpiresAt: DateTime
  lastSyncedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  "Forward page; first: 1..100, default 25."
  syncJobs(first: Int = 25, after: Cursor): SyncJobConnection
}

type CustomProvider implements Node {
  id: ID!
  environmentID: String!
  slug: String!
  name: String!
  description: String!
  status: String!
  allowedActions: [String!]!
  allowedMetrics: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SyncJob implements Node {
  id: ID!
  status: String!
  attempt: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Session implements Node {
  id: ID!
  createdAt: DateTime!
  expiresAt: DateTime!
  revokedAt: DateTime
  lastSeenAt: DateTime
  ipAddress: String
  userAgent: String
}

"Root of the domain API. Domain fields are added with resolver authorization."
type Query {
  _contract: Boolean!
  node(id: ID!): Node
  "Resolve by raw handle or local ID (ID wins on collision); Relay IDs use node(id:)."
  subject(handleOrID: String!): Subject
  "The authenticated account projection; null for anonymous requests."
  viewer: Viewer
  "Bounded built-in provider catalog; custom providers are subject-scoped pages."
  providerCatalog: [ProviderCatalogItem!]!
}

"Calendar date in ISO 8601 YYYY-MM-DD form."
scalar Date

"UTC instant in RFC 3339 form."
scalar DateTime

"Signed 64-bit integer serialized as a base-10 string for JavaScript safety."
scalar Long

"IANA timezone identifier."
scalar TimeZone

"Opaque pagination position; clients must not parse it."
scalar Cursor

enum HeatmapTheme {
  SYSTEM
  LIGHT
  DARK
  GITHUB_LIGHT
  GITHUB_DARK
}

enum WeekStart {
  SUNDAY
  MONDAY
}

enum FetchFailurePolicy {
  KEEP_STALE
  PURGE
}

type UserSettings {
  locale: String!
  timezone: TimeZone!
  theme: HeatmapTheme!
  updatedAt: DateTime!
}

type SubjectSettings {
  timezone: TimeZone!
  isPublic: Boolean!
  defaultTheme: HeatmapTheme!
  weekStart: WeekStart!
  syncEnabled: Boolean!
  syncIntervalMinutes: Int!
  failurePolicy: FetchFailurePolicy!
  updatedAt: DateTime!
}

type SubjectEdge {
  cursor: Cursor!
  node: Subject!
}

type SubjectConnection {
  edges: [SubjectEdge!]!
  pageInfo: PageInfo!
}

input UpdateUserSettingsInput {
  locale: String
  timezone: TimeZone
  theme: HeatmapTheme
}

type UpdateUserSettingsPayload implements MutationPayload {
  errors: [MutationError!]!
  settings: UserSettings
}

input CreateSubjectInput {
  handle: String!
  displayName: String
  timezone: TimeZone!
  isPublic: Boolean
}

type CreateSubjectPayload implements MutationPayload {
  errors: [MutationError!]!
  subject: Subject
}

input UpdateSubjectInput {
  id: ID!
  handle: String
  displayName: String
  "Explicitly clear displayName; mutually exclusive with a supplied value."
  clearDisplayName: Boolean = false
}

type UpdateSubjectPayload implements MutationPayload {
  errors: [MutationError!]!
  subject: Subject
}

input UpdateSubjectSettingsInput {
  subjectID: ID!
  timezone: TimeZone
  isPublic: Boolean
  defaultTheme: HeatmapTheme
  weekStart: WeekStart
  syncEnabled: Boolean
  syncIntervalMinutes: Int
  failurePolicy: FetchFailurePolicy
}

type UpdateSubjectSettingsPayload implements MutationPayload {
  errors: [MutationError!]!
  settings: SubjectSettings
  subject: Subject
}

input RequestSubjectDeletionInput {
  subjectID: ID!
}

type DeletionRequestResult {
  requestID: String!
  status: String!
}

type RequestSubjectDeletionPayload implements MutationPayload {
  errors: [MutationError!]!
  request: DeletionRequestResult
}
