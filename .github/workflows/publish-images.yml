name: Publish immutable images

on:
  workflow_dispatch:
    inputs:
      security_review_path:
        description: Committed human security-review record under docs/evidence/security
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  security-review:
    name: Verify human security review binding
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Validate review evidence and reviewed code binding
        env:
          SECURITY_REVIEW: ${{ inputs.security_review_path }}
        run: |
          case "$SECURITY_REVIEW" in docs/evidence/security/*.md) ;; *) echo "invalid security review path" >&2; exit 2;; esac
          test -f "$SECURITY_REVIEW"
          reviewed_sha=$(awk -F '|' '$2 ~ /^[[:space:]]*Commit SHA[[:space:]]*$/ { gsub(/[[:space:]]/, "", $3); print $3; exit }' "$SECURITY_REVIEW")
          SECURITY_REVIEW_SHA="$reviewed_sha" nix develop --command make security-review-check
          git merge-base --is-ancestor "$reviewed_sha" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$reviewed_sha".."$GITHUB_SHA" | awk -v review="$SECURITY_REVIEW" '$0 != review { print }')"

  publish:
    name: Build and publish immutable images
    needs: security-review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Verify image release policy
        run: nix develop --command make image-release-policy-test ci-version-authority-check
      - name: Build twice, inspect archives, smoke read-only runtime, generate SPDX and scan exact image IDs
        run: nix develop .#images --command sh scripts/build-release-images.sh "$RUNNER_TEMP/image-evidence"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Reject SHA tag mismatch, publish exact archives, scan registry digests, export refs
        run: nix develop .#images --command node scripts/image-release.mjs publish "$RUNNER_TEMP/image-evidence"
      - name: Upload exact image identity and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image-evidence/*.json
            ${{ runner.temp }}/image-evidence/*.txt
            ${{ runner.temp }}/image-evidence/*.log
          if-no-files-found: error
          retention-days: 400
