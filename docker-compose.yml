services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.5@sha256:771325a0586bf61d53322d24f5a6de8962568b0fc181fa45db364278e5961282
    command: >-
      start-single-node
      --insecure
      --store=/cockroach/cockroach-data
      --listen-addr=127.0.0.1:26257
      --sql-addr=0.0.0.0:26258
      --http-addr=0.0.0.0:8080
      --accept-sql-without-tls
    ports:
      - "26257:26258"
      - "18080:8080"
    volumes:
      - cockroach-data-v26:/cockroach/cockroach-data
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cockroach sql --insecure --host=127.0.0.1:26258 -e 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cockroach-data-v26:
