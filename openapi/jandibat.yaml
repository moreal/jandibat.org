components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jandibat_session
      description: Secure, HttpOnly, SameSite=Lax user session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    customProviderKey:
      type: apiKey
      in: header
      name: X-Jandibat-Provider-Key

  parameters:
    Subject:
      name: subject
      in: path
      required: true
      description: Subject ID or unique public handle.
      schema:
        $ref: '#/components/schemas/SubjectIdentifier'
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProviderId'
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CustomProviderId:
      name: customProviderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FromDate:
      name: from
      in: query
      description: Inclusive first date; defaults to 364 days before `to`.
      schema:
        $ref: '#/components/schemas/Date'
    ToDate:
      name: to
      in: query
      description: Inclusive last date; defaults to today in the selected timezone.
      schema:
        $ref: '#/components/schemas/Date'
    Timezone:
      name: timezone
      in: query
      description: IANA timezone; defaults to the subject setting.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        examples: [Asia/Seoul]
    ForceRefresh:
      name: force
      in: query
      description: Bypass cache freshness for authenticated subject owners.
      schema:
        type: boolean
        default: false
    EnvironmentIds:
      name: environmentId
      in: query
      description: Repeat to include only selected environments.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key retained for at least 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255

  headers:
    RequestId:
      description: Identifier for tracing this request.
      schema:
        type: string
    ETag:
      description: Entity tag for conditional retrieval and cache validation.
      schema:
        type: string
    Location:
      description: URI of the created resource or redirect target.
      schema:
        type: string
        format: uri-reference
    SessionCookie:
      description: Secure user session cookie.
      schema:
        type: string
        examples: [jandibat_session=opaque; Path=/; HttpOnly; Secure; SameSite=Lax]
    ClearedSessionCookie:
      description: Expired user session cookie.
      schema:
        type: string
        examples: [jandibat_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax]

  responses:
    BadRequest:
      description: Request validation failed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated caller cannot access this resource
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current resource state
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured ingestion limit
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until the request may be retried.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderFailure:
      description: An upstream provider failed and no usable stale value exists
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: API or a required dependency is unavailable
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until health should be checked again.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    DateTime:
      type: string
      format: date-time
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    ProviderId:
      type: string
      enum: [github, gitlab, codeberg]
    EnvironmentScope:
      type: string
      enum: [global, subject]
    AuthMethod:
      type: string
      enum: [oauth2, token, none]
    ConnectionStatus:
      type: string
      enum: [pending, active, disabled, revoked, error]
    SyncStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    FetchFailurePolicy:
      type: string
      enum: [keep_stale, purge]
      default: keep_stale
    HeatmapTheme:
      type: string
      enum: [system, light, dark, github-light, github-dark]
      default: system
    WeekStart:
      type: string
      enum: [sunday, monday]
      default: sunday
    PageInfo:
      type: object
      required: [hasNextPage]
      properties:
        nextCursor:
          type: [string, 'null']
        hasNextPage:
          type: boolean
    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    SubjectDeletionRequestResponse:
      type: object
      additionalProperties: false
      required: [requestId, status]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable identifier for the durable deletion request.
        status:
          type: string
          const: requested
    HealthResponse:
      type: object
      required: [status, checkedAt, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checkedAt:
          $ref: '#/components/schemas/DateTime'
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    ProviderCatalogItem:
      type: object
      required: [id, name, category, authMethods, supportsPrivateData, supportsScheduledSync]
      properties:
        id:
          $ref: '#/components/schemas/ProviderId'
        name:
          type: string
          examples: [GitHub]
        category:
          type: string
          enum: [git-hosting]
        authMethods:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthMethod'
        supportsPrivateData:
          type: boolean
        supportsScheduledSync:
          type: boolean
    ProviderCatalogResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCatalogItem'
    ActivityMetric:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: [count]
        value:
          type: integer
          minimum: 0
          maximum: 1000000
          format: int64
    ActivityEntry:
      type: object
      required: [environmentId, action, metric, metadata]
      properties:
        environmentId:
          type: string
          minLength: 1
          maxLength: 128
        action:
          type: string
          minLength: 1
          maxLength: 64
          examples: [commit]
        metric:
          $ref: '#/components/schemas/ActivityMetric'
        metadata:
          type: object
          additionalProperties:
            type: string
    ActivityDay:
      type: object
      required: [date, count, level, entries]
      properties:
        date:
          $ref: '#/components/schemas/Date'
        count:
          type: integer
          minimum: 0
          format: int64
        level:
          type: integer
          minimum: 0
          maximum: 4
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEntry'
    Environment:
      type: object
      required: [id, key, name, scope, metadata]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        key:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        scope:
          $ref: '#/components/schemas/EnvironmentScope'
        ownerSubject:
          oneOf:
            - $ref: '#/components/schemas/SubjectIdentifier'
            - type: 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
    ActivityTimelineResponse:
      type: object
      required: [subject, timezone, from, to, generatedAt, stale, environments, days]
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        timezone:
          type: string
          examples: [Asia/Seoul]
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        generatedAt:
          $ref: '#/components/schemas/DateTime'
        stale:
          type: boolean
          description: True when stale cached facts were used after a refresh failure.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
        days:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDay'
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        redirectUri:
          type: string
          format: uri
          maxLength: 2048
          description: Exact allowlisted frontend destination; the server appends the one-time token to its URL fragment only.
    MagicLinkVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048
          writeOnly: true
    PasskeyRegistrationOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
    PasskeyAuthenticationOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    PasskeyOptionsResponse:
      type: object
      required: [ceremonyId, expiresAt, publicKey]
      properties:
        ceremonyId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        publicKey:
          type: object
          description: >-
            PublicKeyCredentialCreationOptionsJSON or
            PublicKeyCredentialRequestOptionsJSON as defined by WebAuthn Level 3.
          additionalProperties: true
    WebAuthnCredential:
      type: object
      additionalProperties: false
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2048
        rawId:
          type: string
          contentEncoding: base64url
          minLength: 1
          maxLength: 2048
        type:
          type: string
          const: public-key
        authenticatorAttachment:
          type: [string, 'null']
          enum: [platform, cross-platform, null]
        response:
          type: object
          maxProperties: 20
          additionalProperties: true
        clientExtensionResults:
          type: object
          maxProperties: 20
          additionalProperties: true
    PasskeyRegistrationVerifyRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
          minLength: 1
          maxLength: 100
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
    PasskeyAuthenticationVerifyRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          $ref: '#/components/schemas/Uuid'
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
    Passkey:
      type: object
      required: [id, label, transports, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        transports:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [usb, nfc, ble, internal, hybrid]
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastUsedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    User:
      type: object
      required: [id, primaryEmail, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        primaryEmail:
          type: string
          format: email
        emailVerifiedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        status:
          type: string
          enum: [active, disabled, pending]
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    Session:
      type: object
      required: [id, userId, current, createdAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        userId:
          type: string
        current:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        lastSeenAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        revokedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        userAgent:
          type: [string, 'null']
        ipAddress:
          description: Canonical IPv4 or IPv6 address without a port.
          oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
            - type: 'null'
    AuthResult:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
    SessionListResponse:
      type: object
      required: [sessions, pageInfo]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    UserSettings:
      type: object
      required: [locale, timezone, theme, updatedAt]
      properties:
        locale:
          type: string
          minLength: 2
          maxLength: 35
          examples: [ko-KR]
        timezone:
          type: string
          examples: [Asia/Seoul]
        theme:
          $ref: '#/components/schemas/HeatmapTheme'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale:
          type: string
          minLength: 2
          maxLength: 35
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        theme:
          $ref: '#/components/schemas/HeatmapTheme'
    Subject:
      type: object
      required: [id, handle, timezone, isPublic, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        handle:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          type: [string, 'null']
          maxLength: 100
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        isPublic:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    CreateSubjectRequest:
      type: object
      additionalProperties: false
      required: [handle, timezone]
      properties:
        handle:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        isPublic:
          type: boolean
          default: true
    UpdateSubjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        handle:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          type: [string, 'null']
          maxLength: 100
    SubjectListResponse:
      type: object
      required: [subjects, pageInfo]
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SubjectSettings:
      type: object
      required:
        [timezone, isPublic, defaultTheme, weekStart, syncEnabled, syncIntervalMinutes, failurePolicy, updatedAt]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        isPublic:
          type: boolean
        defaultTheme:
          $ref: '#/components/schemas/HeatmapTheme'
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        syncEnabled:
          type: boolean
        syncIntervalMinutes:
          type: integer
          minimum: 15
          maximum: 10080
        failurePolicy:
          $ref: '#/components/schemas/FetchFailurePolicy'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    UpdateSubjectSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        isPublic:
          type: boolean
        defaultTheme:
          $ref: '#/components/schemas/HeatmapTheme'
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        syncEnabled:
          type: boolean
        syncIntervalMinutes:
          type: integer
          minimum: 15
          maximum: 10080
        failurePolicy:
          $ref: '#/components/schemas/FetchFailurePolicy'
    ProviderScope:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:/-]+$'
      description: Provider-defined OAuth or token scope without whitespace or control characters.
    ProviderConnection:
      type: object
      required:
        [id, subjectId, providerId, environmentId, authMethod, status, scopes, privateDataEnabled, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          type: string
        providerId:
          $ref: '#/components/schemas/ProviderId'
        environmentId:
          type: string
        authMethod:
          $ref: '#/components/schemas/AuthMethod'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        externalAccountId:
          type: [string, 'null']
        externalAccountName:
          type: [string, 'null']
        scopes:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProviderScope'
        privateDataEnabled:
          type: boolean
          description: True only after the subject owner explicitly consented to private provider data access.
        tokenExpiresAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        lastSyncedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        lastSyncStatus:
          oneOf:
            - $ref: '#/components/schemas/SyncStatus'
            - type: 'null'
        lastError:
          type: [string, 'null']
          maxLength: 1000
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    CreateProviderConnectionRequest:
      type: object
      additionalProperties: false
      required: [providerId, authMethod]
      properties:
        providerId:
          $ref: '#/components/schemas/ProviderId'
        authMethod:
          $ref: '#/components/schemas/AuthMethod'
        token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        scopes:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProviderScope'
        includePrivate:
          type: boolean
          default: false
          description: >-
            Explicit subject-owner consent to collect private provider activity.
            Credential-backed private collection must not be inferred from authMethod.
        redirectUri:
          type: string
          format: uri
          maxLength: 2048
      allOf:
        - if:
            properties:
              authMethod:
                const: token
            required: [authMethod]
          then:
            required: [token]
            properties:
              token:
                type: string
                minLength: 1
                maxLength: 4096
                writeOnly: true
    ProviderConnectionCreateResponse:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: '#/components/schemas/ProviderConnection'
        authorizationUrl:
          type: string
          format: uri
          description: Present only when authMethod is oauth2.
      allOf:
        - if:
            properties:
              connection:
                properties:
                  authMethod:
                    const: oauth2
          then:
            required: [authorizationUrl]
            properties:
              authorizationUrl:
                type: string
                format: uri
    UpdateProviderConnectionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        scopes:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProviderScope'
        enabled:
          type: boolean
    ProviderConnectionListResponse:
      type: object
      required: [connections, pageInfo]
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ProviderConnection'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SyncRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/Date'
        to:
          $ref: '#/components/schemas/Date'
        force:
          type: boolean
          default: false
        failurePolicy:
          $ref: '#/components/schemas/FetchFailurePolicy'
    SyncJob:
      type: object
      required:
        [id, subjectId, connectionId, providerId, status, requestedAt, acceptedFacts, rejectedFacts]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          type: string
        connectionId:
          $ref: '#/components/schemas/Uuid'
        providerId:
          $ref: '#/components/schemas/ProviderId'
        status:
          $ref: '#/components/schemas/SyncStatus'
        requestedAt:
          $ref: '#/components/schemas/DateTime'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        acceptedFacts:
          type: integer
          minimum: 0
        rejectedFacts:
          type: integer
          minimum: 0
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
    CustomProvider:
      type: object
      required:
        [id, subjectId, environmentId, key, name, status, allowedActions, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          type: string
        environmentId:
          type: string
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9_-]*$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        status:
          type: string
          enum: [active, disabled]
        allowedActions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        lastIngestedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    CreateCustomProviderRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9_-]*$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        allowedActions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    UpdateCustomProviderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        status:
          type: string
          enum: [active, disabled]
        allowedActions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    CustomProviderCreatedResponse:
      type: object
      required: [provider, ingestionKey]
      properties:
        provider:
          $ref: '#/components/schemas/CustomProvider'
        ingestionKey:
          type: string
          minLength: 32
          readOnly: true
          description: One-time plaintext credential returned only in this response.
    CustomProviderKeyResponse:
      type: object
      required: [ingestionKey, createdAt]
      properties:
        ingestionKey:
          type: string
          minLength: 32
          readOnly: true
          description: One-time plaintext credential returned only in this response.
        createdAt:
          $ref: '#/components/schemas/DateTime'
    CustomProviderListResponse:
      type: object
      required: [providers, pageInfo]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/CustomProvider'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    CustomActivityEvent:
      type: object
      additionalProperties: false
      required: [eventId, date, action, metric]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable, provider-scoped deduplication identifier.
        date:
          $ref: '#/components/schemas/Date'
        action:
          type: string
          minLength: 1
          maxLength: 64
        metric:
          $ref: '#/components/schemas/ActivityMetric'
        metadata:
          type: object
          maxProperties: 50
          propertyNames:
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
          additionalProperties:
            type: string
            maxLength: 1000
        observedAt:
          $ref: '#/components/schemas/DateTime'
    CustomActivityIngestRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, events]
      description: >-
        Batch-level shape, authentication, quota, and size failures reject the
        whole request. Event-level validation failures are reported in
        rejections while valid events in the same batch remain accepted.
      properties:
        schemaVersion:
          type: string
          const: '1.0'
          description: Version of the custom activity ingestion schema.
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CustomActivityEvent'
    IngestRejection:
      type: object
      required: [eventId, code, detail]
      properties:
        eventId:
          type: string
        code:
          type: string
        detail:
          type: string
    CustomActivityIngestResponse:
      type: object
      required: [accepted, duplicates, rejected, rejections]
      description: >-
        Counts partition the submitted events: accepted + duplicates + rejected
        equals the number of request events. Rejections contains one item for
        each rejected event and never includes batch-level failures.
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        rejections:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/IngestRejection'
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          description: JSON Pointer or parameter name.
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details with stable machine-readable extensions.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z0-9_]+$'
          examples: [validation_failed]
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
